name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            lab/tools/package-lock.json
            site/package-lock.json
      - name: Install maintainer dependencies
        # Learners need none of these; the lab itself has no npm dependencies.
        run: |
          npm ci --prefix lab/tools
          npm ci --prefix site
          cd site
          npx playwright install --with-deps chromium
      - name: Validate both labs and their GIFs
        run: |
          npm --prefix lab test
          npm --prefix lab/tools test
          npm --prefix lab/tools run verify
      - name: Verify generated pages, downloads and browser behavior
        run: |
          npm --prefix site run check
          npm --prefix site run test:bundles
          npm --prefix site run smoke
          git diff --exit-code
      - name: Package committed website and lab files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # The site embeds GIFs and posters from lab/assets, so lab/ is published with it.
        # git archive excludes installed dependencies, learner work, credentials, and Git history.
        # site/scripts/check.mjs (PUBLISHED) rejects links outside these paths; update both together.
        run: git archive --format=tar --output="${{ runner.temp }}/artifact.tar" HEAD index.html site lab
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
