name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            commands/package-lock.json
            skills/package-lock.json
            site/package-lock.json
      - name: Install maintainer dependencies
        run: |
          npm ci --prefix commands
          npm ci --prefix skills
          npm ci --prefix site
          cd site
          npx playwright install --with-deps chromium
      - name: Validate lab files, exercises, and GIFs
        run: |
          npm --prefix commands run validate
          npm --prefix commands test
          npm --prefix commands run verify:assets
          npm --prefix skills run validate
          npm --prefix skills test
          npm --prefix skills run verify:assets
      - name: Verify generated pages and browser behavior
        run: |
          npm --prefix site run check
          npm --prefix site run smoke
          git diff --exit-code
      - name: Package committed website and lab files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # Keep lab .github files: rendered guides link to prompt sources and skill licenses.
        # git archive excludes installed dependencies, learner work, credentials, and Git history.
        # site/scripts/check.mjs (PUBLISHED) rejects links outside these paths; update both together.
        run: git archive --format=tar --output="${{ runner.temp }}/artifact.tar" HEAD index.html site commands skills
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
