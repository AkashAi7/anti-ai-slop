<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skills lab - build-only illustrative capture stage</title>
  <style>
    :root { --bg: #15191e; --panel: #1d232b; --line: #39434e; --text: #edf2f7; --muted: #bac6d3; --accent: #70dfc2; --warn: #ffce80; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--text); font: 18px "Segoe UI", sans-serif; }
    header { height: 44px; padding: 10px 24px; background: #101419; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); }
    .intro { height: 124px; padding: 20px 32px 16px; }
    .eyebrow { color: var(--accent); font-size: 14px; letter-spacing: 2px; font-weight: 700; }
    h1 { margin: 6px 0 0; font-size: 32px; font-weight: 600; line-height: 1.25; }
    main { height: 406px; margin: 0 32px; border: 1px solid var(--line); display: grid; grid-template-columns: 58% 42%; }
    .editor { min-width: 0; background: #141a20; }
    .tab, .chat-title { height: 42px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 15px; }
    .tab { color: var(--accent); }
    pre { margin: 0; padding: 24px; white-space: pre-wrap; overflow-wrap: anywhere; font: 20px/1.6 Consolas, monospace; color: #e3ecf5; }
    .chat { border-left: 1px solid var(--line); min-width: 0; }
    .chat-body { padding: 20px 24px; }
    .label { font-size: 12px; letter-spacing: 1.5px; font-weight: 700; color: var(--muted); margin: 0 0 8px; }
    .prompt { font-size: 19px; line-height: 1.4; margin: 0 0 20px; color: #f5f8fc; }
    .response { white-space: pre-line; font-size: 19px; line-height: 1.5; margin: 0; color: var(--muted); }
    .terminal { margin: 0 32px; height: 58px; border: 1px solid var(--line); border-top: 0; padding: 16px 20px; font: 16px Consolas, monospace; color: var(--warn); background: #101419; }
    .bottom { padding: 12px 32px 0; display: flex; gap: 20px; align-items: center; }
    .progress { display: flex; gap: 6px; flex: 0 0 160px; }
    .segment { height: 4px; background: var(--line); flex: 1; }
    .segment.done { background: var(--accent); }
    .takeaway { font-size: 15px; color: var(--muted); margin: 0; }
    footer { position: absolute; bottom: 0; left: 0; width: 100%; padding: 9px 32px; color: #e1e9f1; font-size: 13px; background: #26323e; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header><span>SKILLS / ANTI-SLOP LAB</span><span id="title"></span><span>VS Code-style teaching view</span></header>
  <section class="intro"><div class="eyebrow" id="phase"></div><h1 id="heading"></h1></section>
  <main>
    <section class="editor"><div class="tab" id="file"></div><pre id="code"></pre></section>
    <section class="chat"><div class="chat-title">Copilot Chat / illustrative conversation</div><div class="chat-body">
      <p class="label">PARTICIPANT</p><p class="prompt" id="prompt"></p>
      <p class="label">WORKFLOW</p><p class="response" id="response"></p>
    </div></section>
  </main>
  <div class="terminal" id="terminal"></div>
  <div class="bottom"><div class="progress" id="progress"></div><p class="takeaway" id="takeaway"></p></div>
  <footer><span id="disclaimer">Illustrative walkthrough - not recorded Copilot output</span><span>Run the real exercise in VS Code</span></footer>
  <script>
    window.renderFrame = (scene, index, fraction = 1) => {
      const step = scene.steps[index];
      for (const [id, text] of Object.entries({
        title: scene.title, phase: `${index + 1} / ${scene.steps.length}  -  ${step.phase}`,
        heading: step.heading, file: `work/${scene.exercise}/${scene.file}`,
        code: step.code, prompt: step.prompt,
        response: step.response.slice(0, Math.ceil(step.response.length * fraction)),
        terminal: step.terminal, takeaway: scene.takeaway,
      })) document.getElementById(id).textContent = text;
      const progress = document.getElementById('progress');
      progress.replaceChildren(...scene.steps.map((_, i) => {
        const segment = document.createElement('span');
        segment.className = `segment${i <= index ? ' done' : ''}`;
        return segment;
      }));
    };
  </script>
</body>
</html>
